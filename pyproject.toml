[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-pingram-gateway"
version = "1.1.1"
description = "Hermes Agent platform plugin: Pingram SMS, Email, and Voice gateways."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pingram" }]
keywords = ["hermes", "hermes-agent", "pingram", "sms", "email", "voice", "gateway", "plugin", "chatbot"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Communications :: Email",
  "Intended Audience :: Developers",
]
dependencies = [
  "pingram-python>=1.0.10",
  "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/pingram-io/hermes-gateway"
Repository = "https://github.com/pingram-io/hermes-gateway"

[project.entry-points."hermes_agent.plugins"]
pingram = "pingram_gateway"

[tool.setuptools.packages.find]
where = ["."]
include = ["pingram_gateway*"]
