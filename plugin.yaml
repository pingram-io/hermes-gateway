name: pingram
label: Pingram
kind: platform
version: 1.0.2
description: >
  Pingram gateway adapters for Hermes Agent. Registers three platforms —
  pingram-sms, pingram-email, and pingram-voice. SMS and Email receive inbound
  messages by polling Pingram's logs API. Voice places outbound calls using a
  Voice Agent created in the Pingram app. Finished calls Hermes placed are
  polled for outcome and transcript. All three send through the Pingram
  Python SDK.
author: Pingram
optional_env:
  - name: PINGRAM_FROM_SMS
    description: "Optional SMS sender number (E.164). Blank uses Pingram account default."
    prompt: "SMS sender number (optional)"
    password: false
  - name: PINGRAM_FROM_EMAIL
    description: "Optional email sender address. Blank uses Pingram default."
    prompt: "Email sender address (optional)"
    password: false
  - name: PINGRAM_FROM_NAME
    description: "Email sender display name (default Hermes)."
    prompt: "Email sender display name"
    password: false
  - name: PINGRAM_SMS_ALLOWED_USERS
    description: "Comma-separated phone numbers allowed to SMS the agent."
    prompt: "SMS allowed users"
    password: false
  - name: PINGRAM_SMS_HOME_CHANNEL
    description: "Default SMS destination for proactive sends and cron (E.164)."
    prompt: "SMS home channel"
    password: false
  - name: PINGRAM_EMAIL_ALLOWED_USERS
    description: "Comma-separated email addresses allowed to email the agent."
    prompt: "Email allowed users"
    password: false
  - name: PINGRAM_EMAIL_HOME_CHANNEL
    description: "Default email destination for proactive sends and cron."
    prompt: "Email home channel"
    password: false
  - name: PINGRAM_VOICE_ALLOWED_USERS
    description: "Comma-separated phone numbers the agent may call."
    prompt: "Voice allowed numbers"
    password: false
  - name: PINGRAM_VOICE_HOME_CHANNEL
    description: "Unused. Voice is never a Hermes home channel (startup/replies would place calls)."
    prompt: "Voice home channel (leave blank)"
    password: false
  - name: PINGRAM_VOICE_AGENT_ID
    description: "Voice Agent created in the Pingram app. Blank uses the first agent on the account."
    prompt: "Voice Agent id"
    password: false
  - name: PINGRAM_POLL_INTERVAL
    description: "Seconds between inbound poll cycles (default 15)."
    prompt: "Poll interval (seconds)"
    password: false
  - name: PINGRAM_POLL_LIMIT
    description: "Max messages fetched per poll page (default 50)."
    prompt: "Poll page size"
    password: false
  - name: PINGRAM_ALLOW_ALL_USERS
    description: "Allow anyone to talk to the agent (dev only). Default false."
    prompt: "Allow all users? (true/false)"
    password: false
  - name: PINGRAM_NOTIFICATION_TYPE
    description: "Pingram notification type for outbound messages (default hermes_agent)."
    prompt: "Notification type"
    password: false
